<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Crush ghé chơi — hình minh họa 1:1</title>
<!-- Dựng ra PNG: chrome --headless=new --screenshot=crush-ghe-choi-1x1.png --window-size=1080,1080
     --force-device-scale-factor=2 --hide-scrollbars crush-ghe-choi-1x1.html -->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1080px; overflow: hidden; }
  body { font-family: "Segoe UI Variable Display", "Segoe UI Variable Text", "Segoe UI", sans-serif; color: #fff; }

  /* Nền: màn hình desktop */
  .desktop {
    position: relative; width: 1080px; height: 1080px; overflow: hidden;
    background:
      radial-gradient(620px 520px at 88% 34%, rgba(255, 110, 170, .78), transparent 70%),
      radial-gradient(700px 600px at 6% 96%, rgba(64, 150, 255, .75), transparent 70%),
      radial-gradient(520px 440px at 46% 58%, rgba(150, 90, 255, .5), transparent 72%),
      linear-gradient(140deg, #16205c 0%, #2a1d6b 48%, #4a1a63 100%);
  }

  /* Khối chữ */
  h1 { position: absolute; left: 64px; top: 70px; font-size: 118px; line-height: 1.04; font-weight: 700; letter-spacing: -2.5px;
       text-shadow: 0 6px 30px rgba(10, 8, 50, .35); }
  h1 span { color: #ffb6d2; }
  .tagline { position: absolute; left: 70px; top: 214px; font-size: 36px; font-weight: 500;
             color: rgba(255,255,255,.95); text-shadow: 0 2px 14px rgba(10, 8, 50, .35); }

  /* Cửa sổ đang làm việc: để thật đơn giản */
  .window { position: absolute; left: 64px; top: 372px; width: 600px; height: 520px; border-radius: 14px; overflow: hidden;
            background: rgba(24, 25, 40, .82); border: 1px solid rgba(255,255,255,.16); box-shadow: 0 30px 70px rgba(6, 6, 30, .5); }
  .titlebar { height: 46px; background: rgba(255,255,255,.07); display: flex; align-items: center; justify-content: flex-end; }
  .ctrl { width: 46px; height: 46px; position: relative; }
  .ctrl.min::before { content: ""; position: absolute; left: 18px; top: 23px; width: 11px; height: 1.4px; background: #c9cbd6; }
  .ctrl.max::before { content: ""; position: absolute; left: 18px; top: 17px; width: 10px; height: 10px; border: 1.4px solid #c9cbd6; border-radius: 2px; }
  .ctrl.close::before, .ctrl.close::after { content: ""; position: absolute; left: 16px; top: 22.5px; width: 14px; height: 1.4px; background: #c9cbd6; }
  .ctrl.close::before { transform: rotate(45deg); } .ctrl.close::after { transform: rotate(-45deg); }
  .work { padding: 34px 36px; }
  .work i { display: block; height: 16px; border-radius: 8px; background: rgba(255,255,255,.13); margin-bottom: 24px; }
  .work i.h { height: 24px; width: 46%; background: rgba(255,255,255,.24); margin-bottom: 34px; }

  /* Crush ghé chơi: bé chibi pixel đứng trên thanh taskbar */
  .crush { position: absolute; left: 500px; top: 502px; width: 480px; height: 504px; image-rendering: pixelated;
           filter: drop-shadow(0 0 0 #fff) drop-shadow(0 18px 30px rgba(30, 6, 40, .5)); }
  .bubble { position: absolute; left: 318px; top: 408px; padding: 17px 28px 19px; border-radius: 26px; background: #fff; color: #3d2433;
            font-size: 33px; font-weight: 600; border: 3px solid #f29ebd; box-shadow: 0 14px 34px rgba(30, 6, 40, .35); white-space: nowrap; }
  .bubble::after { content: ""; position: absolute; right: 60px; bottom: -16px; width: 26px; height: 26px; background: #fff;
                   border-right: 3px solid #f29ebd; border-bottom: 3px solid #f29ebd; transform: rotate(45deg) skew(12deg, 12deg); border-bottom-right-radius: 6px; }
  .heart { position: absolute; shape-rendering: crispEdges; filter: drop-shadow(0 6px 10px rgba(40, 6, 40, .35)); }

  /* Thanh taskbar */
  .taskbar { position: absolute; left: 0; right: 0; bottom: 0; height: 74px; background: rgba(22, 22, 44, .74);
             border-top: 1px solid rgba(255,255,255,.14); backdrop-filter: blur(24px); }
  .apps { position: absolute; left: 50%; top: 13px; transform: translateX(-50%); display: flex; gap: 16px; }
  .app { width: 48px; height: 48px; border-radius: 11px; position: relative; display: grid; place-items: center; }
  .app.active { background: rgba(255,255,255,.12); }
  .app.active::after { content: ""; position: absolute; bottom: 1px; left: 50%; width: 18px; height: 3.5px; margin-left: -9px; border-radius: 2px; background: #8fb8ff; }
  .start { display: grid; grid-template-columns: 13px 13px; gap: 3px; }
  .start b { width: 13px; height: 13px; border-radius: 2.5px; background: linear-gradient(135deg, #7fd0ff, #3d8bff); }
  .glyph { width: 30px; height: 30px; border-radius: 8px; }
  .search { width: 20px; height: 20px; border: 3px solid #e6e8f5; border-radius: 50%; position: relative; }
  .search::after { content: ""; position: absolute; right: -9px; bottom: -6px; width: 10px; height: 3px; background: #e6e8f5; border-radius: 2px; transform: rotate(45deg); }
  .tray { position: absolute; right: 26px; top: 0; height: 74px; display: flex; align-items: center; gap: 15px; }
  .chev { width: 10px; height: 10px; border-left: 2.2px solid #e6e8f5; border-top: 2.2px solid #e6e8f5; transform: rotate(45deg); margin-top: 6px; }
  .trayheart { width: 42px; height: 42px; border-radius: 10px; display: grid; place-items: center; background: rgba(255, 110, 165, .26);
               box-shadow: 0 0 0 2px rgba(255, 150, 190, .9), 0 0 22px rgba(255, 110, 165, .8); }
  .trayheart svg { width: 24px; height: 24px; }
  .sys { width: 20px; height: 20px; }
  .clock { text-align: right; font-size: 16.5px; line-height: 1.3; color: #eef0fa; font-weight: 500; }
</style>
</head>
<body>
<div class="desktop">

  <h1>Crush <span>ghé chơi</span></h1>
  <p class="tagline">Crush ghé màn hình, thả tim rồi đi.</p>

  <div class="window">
    <div class="titlebar"><div class="ctrl min"></div><div class="ctrl max"></div><div class="ctrl close"></div></div>
    <div class="work"><i class="h"></i><i style="width:92%"></i><i style="width:80%"></i><i style="width:88%"></i><i style="width:58%"></i><i class="h" style="margin-top:40px;width:34%"></i><i style="width:86%"></i><i style="width:70%"></i></div>
  </div>

  <!-- Tim pixel bay ra từ chỗ hun gió -->
  <svg class="heart" style="left:964px;top:600px;width:70px" viewBox="0 0 7 6"><use href="#ph" fill="#ff5c93"/></svg>
  <svg class="heart" style="left:992px;top:486px;width:49px;opacity:.95" viewBox="0 0 7 6"><use href="#ph" fill="#ff8fb8"/></svg>
  <svg class="heart" style="left:920px;top:404px;width:42px;opacity:.9" viewBox="0 0 7 6"><use href="#ph" fill="#ff3b6f"/></svg>
  <svg class="heart" style="left:1000px;top:330px;width:28px;opacity:.75" viewBox="0 0 7 6"><use href="#ph" fill="#ffc2d8"/></svg>

  <div class="bubble">Hé lô, tui ghé xíu nè.</div>
  <img class="crush" src="chibi.png" alt="">

  <div class="taskbar">
    <div class="apps">
      <div class="app"><div class="start"><b></b><b></b><b></b><b></b></div></div>
      <div class="app"><div class="search"></div></div>
      <div class="app"><div class="glyph" style="background:linear-gradient(160deg,#ffd76a,#f2a93b);border-radius:6px 9px 8px 8px"></div></div>
      <div class="app"><div class="glyph" style="background:conic-gradient(from 200deg,#3bc7ff,#3b7dff,#39d98a,#3bc7ff);border-radius:50%"></div></div>
      <div class="app active"><div class="glyph" style="background:linear-gradient(135deg,#8c7bff,#4f8dff)"></div></div>
    </div>
    <div class="tray">
      <div class="chev"></div>
      <div class="trayheart"><svg viewBox="0 0 24 24"><use href="#h" fill="#ff6ea5"/></svg></div>
      <svg class="sys" viewBox="0 0 24 24" fill="none" stroke="#e6e8f5" stroke-width="2.2" stroke-linecap="round"><path d="M3 9.5a13 13 0 0 1 18 0M6.5 13.2a8 8 0 0 1 11 0M10 17a3 3 0 0 1 4 0"/></svg>
      <svg class="sys" viewBox="0 0 24 24" fill="#e6e8f5"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7" fill="none" stroke="#e6e8f5" stroke-width="2.2" stroke-linecap="round"/></svg>
      <div class="clock">10:30<br>14/11/2026</div>
    </div>
  </div>

  <svg width="0" height="0" style="position:absolute"><defs>
    <path id="ph" d="M1 0h2v1h-2z M4 0h2v1h-2z M0 1h7v2h-7z M1 3h5v1h-5z M2 4h3v1h-3z M3 5h1v1h-1z"/>
    <path id="h" d="M12,21.35 L10.55,20.03 C5.4,15.36 2,12.28 2,8.5 C2,5.42 4.42,3 7.5,3 C9.24,3 10.91,3.81 12,5.09 C13.09,3.81 14.76,3 16.5,3 C19.58,3 22,5.42 22,8.5 C22,12.28 18.6,15.36 13.45,20.04 Z"/>
  </defs></svg>
</div>
</body>
</html>
